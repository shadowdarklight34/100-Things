<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Type Garden — laxnz.me</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&amp;family=Playfair+Display:wght@700&amp;display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;height:100dvh;background:#000;overflow:hidden;overscroll-behavior:none;font-family:'DM Mono',ui-monospace,monospace}
  a{color:#fff} a:hover{color:#FFB4A8}
  input[type=range]{accent-color:#fff}
  #app{-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;position:fixed;inset:0;height:100dvh;cursor:text}
  #app button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  html[data-touch] #app{touch-action:none;top:var(--tg-top,0px)!important;bottom:auto!important;height:var(--tg-h,100dvh)!important}
  #modes{position:absolute;top:calc(16px + env(safe-area-inset-top));right:calc(16px + env(safe-area-inset-right));z-index:5;display:flex;gap:4px;padding:4px;border:1px solid #2A2A2A;border-radius:999px;background:#000}
  #modes button{border:0;border-radius:999px;padding:7px 14px;min-height:36px;font:inherit;font-size:12px;letter-spacing:.04em;cursor:pointer;background:transparent;color:#BDBDBD}
  #modes button.active{background:#fff;color:#000}
  #bar{position:absolute;left:calc(24px + env(safe-area-inset-left));right:calc(24px + env(safe-area-inset-right));bottom:calc(20px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;font-size:12px;letter-spacing:.04em;opacity:.6}
  #hints{display:flex;gap:20px;flex-wrap:wrap}
  #ctrls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  #pal{display:flex;gap:6px;align-items:center;padding:4px 6px;border:1px solid #3A3A3A;border-radius:999px}
  .sw{width:22px;height:22px;padding:0;border-radius:999px;cursor:pointer;border:1.5px solid transparent;display:flex;align-items:center;justify-content:center}
  .sw .dot{width:10px;height:10px;border-radius:999px}
  .btn{background:transparent;border:1px solid #3A3A3A;color:#BDBDBD;font:inherit;padding:8px 14px;min-height:40px;display:inline-flex;align-items:center;border-radius:999px;cursor:pointer}
  .btn:hover{border-color:#fff;color:#fff}
  #inputField{position:fixed;left:0;top:0;width:1px;height:1px;margin:0;padding:0;border:0;opacity:0;font-size:16px;color:transparent;background:transparent;caret-color:transparent;pointer-events:none}
  #copyCode{position:absolute;top:calc(16px + env(safe-area-inset-top));left:calc(16px + env(safe-area-inset-left));z-index:5}
  .sw{min-height:24px}
  @media (max-width:600px){
    #bar{left:16px;right:16px;bottom:14px;gap:10px}
    #hints{gap:12px;font-size:11px}
    #ctrls{flex:1 1 100%;justify-content:space-between;gap:8px}
    .btn{padding:7px 11px}
  }
  #poster{position:absolute;inset:0;display:none;grid-template-columns:minmax(280px,340px) minmax(0,1fr);background:#000;cursor:default;color:#EDEDED;font-size:12px;letter-spacing:.03em}
  #poster.show{display:grid}
  #panel{border-right:1px solid #1E1E1E;overflow-y:auto;overflow-x:hidden;padding:24px 22px 32px;display:flex;flex-direction:column;gap:26px;background:#0A0A0A}
  #stage{display:flex;align-items:center;justify-content:center;padding:56px 32px 32px;min-width:0}
  #pcanvas{width:min(100%, calc(100vh - 96px));height:auto;aspect-ratio:1/1;display:block;border:1px solid #1E1E1E}
  .lbl{color:#8C8C8C;text-transform:uppercase;font-size:11px;letter-spacing:.08em}
  #pText{background:#000;border:1px solid #2A2A2A;border-radius:10px;color:#fff;font-family:'Playfair Display',serif;font-weight:700;font-size:22px;padding:10px 12px;outline:none;width:100%;box-sizing:border-box}
  #pText:focus{border-color:#fff}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .presetBtn{text-align:left;background:transparent;border:1px solid #2A2A2A;color:#fff;font:inherit;padding:10px 12px;border-radius:10px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
  .presetBtn.active{background:#161616;border-color:#fff}
  .presetBtn span.sub{color:#8C8C8C;font-size:11px}
  .palCard{display:flex;flex-direction:column;gap:8px;align-items:stretch;background:transparent;border:1px solid #2A2A2A;color:#EDEDED;font:inherit;padding:6px 6px 8px;border-radius:12px;cursor:pointer;text-align:left}
  .palCard:hover{border-color:#8C8C8C}
  .palCard.active{border-color:#fff}
  .palSwatch{display:flex;align-items:center;justify-content:center;height:44px;border-radius:8px}
  #videoBtn{background:#fff;border:0;color:#000;font:inherit;font-weight:500;padding:12px 14px;border-radius:999px;cursor:pointer;width:100%}
  #framesBtn{background:transparent;border:1px solid #3A3A3A;color:#EDEDED;font:inherit;padding:11px 14px;border-radius:999px;cursor:pointer;width:100%}
  #framesBtn:hover{border-color:#fff}
  #status{color:#8C8C8C;min-height:16px}
  @media (max-width:720px){
    #poster.show{display:flex;flex-direction:column;overflow-y:auto}
    #stage{order:-1;flex:none;padding:16px 16px 12px}
    #panel{flex:none;border-right:0;border-top:1px solid #1E1E1E;padding:20px 16px 32px}
  }
</style>
</head>

ground: rgb(0, 0, 0); border-color: rgb(58, 58, 58); transform: scale(1);"><span class="dot" style="background: rgb(242, 242, 242);"></span></button></div>

ng:0 4px">Citrus</span></button><button class="palCard" aria-label="Orchid"><span class="palSwatch" style="background:#140A1F"><span style="width:18px;height:18px;border-radius:50%;background:#E63CFF;display:inline-block"></span><span style="width:12px;height:12px;border-radius:50%;background:#2FB8A6;margin-left:-4px;display:inline-block"></span><span style="font-family:'Playfair Display',serif;font-weight:700;font-size:18px;color:#FFFFFF;margin-left:8px">Aa</span></span><span style="padding:0 4px">Orchid</span></button><button class="palCard" aria-label="Moss"><span class="palSwatch" style="background:#133A2A"><span style="width:18px;height:18px;border-radius:50%;background:#FFB7C5;display:inline-block"></span><span style="width:12px;height:12px;border-radius:50%;background:#7FD18B;margin-left:-4px;display:inline-block"></span><span style="font-family:'Playfair Display',serif;font-weight:700;font-size:18px;color:#F6F1E7;margin-left:8px">Aa</span></span><span style="padding:0 4px">Moss</span></button><button class="palCard" aria-label="Tomato"><span class="palSwatch" style="background:#FF1400"><span style="width:18px;height:18px;border-radius:50%;background:#FFF1E0;display:inline-block"></span><span style="width:12px;height:12px;border-radius:50%;background:#0B0B0B;margin-left:-4px;display:inline-block"></span><span style="font-family:'Playfair Display',serif;font-weight:700;font-size:18px;color:#000000;margin-left:8px">Aa</span></span><span style="padding:0 4px">Tomato</span></button><button class="palCard" aria-label="Butter"><span class="palSwatch" style="background:#FFE9A8"><span style="width:18px;height:18px;border-radius:50%;background:#E4002B;display:inline-block"></span><span style="width:12px;height:12px;border-radius:50%;background:#0F5132;margin-left:-4px;display:inline-block"></span><span style="font-family:'Playfair Display',serif;font-weight:700;font-size:18px;color:#1A1A1A;margin-left:8px">Aa</span></span><span style="padding:0 4px">Butter</span></button><button class="palCard" aria-label="Blush"><span class="palSwatch" style="background:#FAD4D8"><span style="width:18px;height:18px;border-radius:50%;background:#C8102E;display:inline-block"></span><span style="width:12px;height:12px;border-radius:50%;background:#274690;margin-left:-4px;display:inline-block"></span><span style="font-family:'Playfair Display',serif;font-weight:700;font-size:18px;color:#1A1A1A;margin-left:8px">Aa</span></span><span style="padding:0 4px">Blush</span></button><button class="palCard" aria-label="Mono"><span class="palSwatch" style="background:#000000"><span style="width:18px;height:18px;border-radius:50%;background:#F2F2F2;display:inline-block"></span><span style="width:12px;height:12px;border-radius:50%;background:#6E6E6E;margin-left:-4px;display:inline-block"></span><span style="font-family:'Playfair Display',serif;font-weight:700;font-size:18px;color:#FFFFFF;margin-left:8px">Aa</span></span><span style="padding:0 4px">Mono</span></button></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px;border-top:1px solid #1E1E1E;padding-top:20px">
        <div class="lbl">Export · 1080 × 1080 loop</div>

      </div>
    </div>
    <div id="stage"><canvas id="pcv" width="1080" height="1080"></canvas></div>
  </div>
</div>

function h(n){ var x = Math.sin(n) * 43758.5453; return x - Math.floor(x); }

function posterFly(B,tt,Pp,C){

  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  var B = {
    fill: function(p,col){ var b=pb(); path(b,p,true); parts.push('<path d="'+b.d+'" fill="'+col+'"/>'); },
    stroke: function(p,col,w){ var b=pb(); path(b,p,false); parts.push('<path d="'+b.d+'" fill="none" stroke="'+col+'" stroke-width="'+n(w)+'" stroke-linecap="round" stroke-linejoin="round"/>'); },
    rect: function(){},
    text: function(ch,x,y,S,col){
      parts.push('<text id="'+lid(ch)+'" x="'+n(x)+'" y="'+n(y)+'" text-anchor="middle" font-family="Playfair Display, Georgia, serif" font-weight="700" font-size="'+n(S)+'" fill="'+col+'">'+esc(ch)+'</text>');
    }
  };
  render(B, performance.now(), mainState());
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="'+n(W)+'" height="'+n(H)+'" viewBox="0 0 '+n(W)+' '+n(H)+'"><rect width="100%" height="100%" fill="'+pal().bg+'"/>'+parts.join('')+'</svg>';
  dl(new Blob([svg], {type:'image/svg+xml'}), 'garden.svg');
}
function fname(){ return 'garden-' + (state.text||'loop').trim().replace(/[^a-z0-9]+/gi,'-').toLowerCase().slice(0,24) + '-' + state.preset; }
function zip(files){
  var crcT = (function(){ var t=new Uint32Array(256); for (var n=0;n<256;n++){ var c=n; for (var k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();
  function crc(d){ var c=0xFFFFFFFF; for (var i=0;i<d.length;i++) c = crcT[(c^d[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
  var enc = new TextEncoder(), parts=[], cen=[], off=0;
  files.forEach(function(f){
    var nm = enc.encode(f.name), cr = crc(f.data), sz = f.data.length;
    var hh = new DataView(new ArrayBuffer(30));
    hh.setUint32(0,0x04034b50,true); hh.setUint16(4,20,true); hh.setUint16(8,0,true); hh.setUint16(12,33,true);
    hh.setUint32(14,cr,true); hh.setUint32(18,sz,true); hh.setUint32(22,sz,true); hh.setUint16(26,nm.length,true);
    parts.push(hh.buffer, nm, f.data);
    var c = new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint16(14,33,true);
    c.setUint32(16,cr,true); c.setUint32(20,sz,true); c.setUint32(24,sz,true); c.setUint16(28,nm.length,true); c.setUint32(42,off,true);
    cen.push(c.buffer, nm);
    off += 30+nm.length+sz;
  });
  var cs = cen.reduce(function(s,b){ return s+(b.byteLength||b.length); },0);
  var e = new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true); e.setUint16(8,files.length,true); e.setUint16(10,files.length,true); e.setUint32(12,cs,true); e.setUint32(16,off,true);
  return new Blob(parts.concat(cen,[e.buffer]), {type:'application/zip'});
}
function wait(ms){ return new Promise(function(r){ setTimeout(r,ms); }); }
function setStatus(s){ state.status = s; document.getElementById('status').textContent = s; }
function setBusy(b){ state.busy = b; document.getElementById('videoBtn').disabled=b; document.getElementById('framesBtn').disabled=b; }
async function exportVideo(){
  if (!vmime || state.busy){ setStatus('Video export isn’t supported in this browser — use PNG frames.'); return; }
  var c = document.createElement('canvas'); c.width=c.height=1080;
  var cg = c.getContext('2d'), stream = c.captureStream(0), track = stream.getVideoTracks()[0];
  var rec = new MediaRecorder(stream, {mimeType:vmime, videoBitsPerSecond:14e6}), chunks=[];
  rec.ondataavailable = function(e){ if (e.data && e.data.size) chunks.push(e.data); };
  var done = new Promise(function(r){ rec.onstop = r; });
  setBusy(true); setStatus('Recording…');
  posterDraw(cg,0); rec.start();
  var N = Math.round(P.T/1000*30), t0r = performance.now();
  for (var i=0;i<N;i++){
    posterDraw(cg, i*1000/30);
    if (track.requestFrame) track.requestFrame();
    if (i%15===0) setStatus('Recording '+Math.round(i/N*100)+'%');
    var target = t0r+(i+1)*1000/30; await wait(Math.max(0, target-performance.now()));
  }
  rec.stop(); await done;
  var ext = vmime.indexOf('mp4')>=0 ? 'mp4' : 'webm';
  dl(new Blob(chunks, {type:vmime.split(';')[0]}), fname()+'.'+ext);
  setBusy(false); setStatus('Saved '+ext.toUpperCase()+' · '+N+' frames');
}
async function exportFrames(){
  if (state.busy) return;
  var c = document.createElement('canvas'); c.width=c.height=1080;
  var cg = c.getContext('2d'), N = Math.round(P.T/1000*30), files=[];
  setBusy(true); setStatus('Rendering frames…');
  for (var i=0;i<N;i++){
    posterDraw(cg, i*1000/30);
    var b = await new Promise(function(r){ c.toBlob(r,'image/png'); });
    files.push({ name:'frame_'+String(i+1).padStart(4,'0')+'.png', data:new Uint8Array(await b.arrayBuffer()) });
    if (i%10===0) setStatus('Rendering '+Math.round(i/N*100)+'%');
  }
  dl(zip(files), fname()+'-frames.zip');
  setBusy(false); setStatus('Saved '+N+' PNG frames · 30 fps');
}
